name: 功能建议 / Feature request
description: 提一个新功能或改进 / Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认 / Before you file
      options:
        - label: 我已搜索过现有 issue / discussion，没有重复 / I searched existing issues and discussions
          required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Scenario
      description: 你在做什么、遇到了什么不方便 / What are you doing, and what's awkward about it today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Desired behaviour
      description: 你希望它怎么工作 / How you'd like it to work
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 现在你是怎么绕过去的 / How you work around it now
    validations:
      required: false
